<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU Gas Dashboard — Palissy Advisors</title>
<style>
    @font-face {
        font-family: 'Gotham Book';
        src: url('Gotham-Book.otf') format('opentype');
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Gotham Book', 'Segoe UI', Calibri, sans-serif;
        background: #ffffff;
    }
    .toggle-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 15px 20px 0 20px;
        background: #ffffff;
        max-width: 1500px;
        margin: 0 auto;
    }
    .toggle-btn {
        font-family: 'Gotham Book', 'Segoe UI', Calibri, sans-serif;
        font-size: 15px;
        font-weight: bold;
        padding: 10px 35px;
        border: 2px solid #272962;
        background: #ffffff;
        color: #272962;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .toggle-btn:first-child {
        border-radius: 6px 0 0 6px;
        border-right: 1px solid #272962;
    }
    .toggle-btn:last-child {
        border-radius: 0 6px 6px 0;
        border-left: 1px solid #272962;
    }
    .toggle-btn.active {
        background: #272962;
        color: #ffffff;
    }
    .toggle-btn:hover:not(.active) {
        background: #f0f0f5;
    }
    iframe {
        width: 100%;
        border: none;
        display: block;
    }

    @media (max-width: 600px) {
        .toggle-btn {
            font-size: 13px;
            padding: 8px 20px;
        }
    }
</style>
</head>
<body>
<div class="toggle-bar">
    <button class="toggle-btn active" id="btn-storage" onclick="showPage('storage')">Storage</button>
    <button class="toggle-btn" id="btn-lng" onclick="showPage('lng')">LNG</button>
</div>
<iframe id="chartFrame" src="storage.html"></iframe>

<script>
function showPage(page) {
    document.getElementById('chartFrame').src = page + '.html';
    document.getElementById('btn-storage').classList.toggle('active', page === 'storage');
    document.getElementById('btn-lng').classList.toggle('active', page === 'lng');
}

// Auto-resize iframe to fit content
function resizeIframe() {
    const iframe = document.getElementById('chartFrame');
    try {
        iframe.style.height = iframe.contentWindow.document.documentElement.scrollHeight + 'px';
    } catch(e) {
        iframe.style.height = '100vh';
    }
}

document.getElementById('chartFrame').addEventListener('load', function() {
    resizeIframe();
    // Also resize after a short delay for Chart.js rendering
    setTimeout(resizeIframe, 500);
    setTimeout(resizeIframe, 1500);
});

// Resize on window resize
window.addEventListener('resize', resizeIframe);
</script>
</body>
</html>
