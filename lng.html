    const monthlyByGY = {};
    for (const gy of gyKeys) {
        monthlyByGY[gy] = toMonthlyAvg(histSeries[gy]);
    }
    const avgData = [], minData = [], maxData = [];
    for (let m = 0; m < 12; m++) {
        const vals = [];
        for (const gy of gyKeys) {
            const v = monthlyByGY[gy][m];
            if (v !== null) vals.push(v);
        }
        if (vals.length > 0) {
            avgData.push(vals.reduce((a, b) => a + b, 0) / vals.length);
            minData.push(Math.min(...vals));
            maxData.push(Math.max(...vals));
        } else {
            avgData.push(null);
            minData.push(null);
            maxData.push(null);
        }
    }
    return { avgData, minData, maxData };
}

function fmt(value, decimals) {
    if (Math.abs(value) >= 1000) {
        return Math.round(value).toLocaleString('en-US');
    }
    return value.toFixed(decimals);
}

function rebuildChart() {
    const rangeYears = parseInt(document.getElementById('rangeSelector').value);
    const isMonthly = document.getElementById('periodSelector').value === 'monthly';
    const rangeLabel = rangeYears + '-year range';
    const avgLabel = rangeYears + '-year average';
    document.getElementById('legend-range').textContent = rangeLabel;
    document.getElementById('legend-avg').textContent = avgLabel;

    const uc = getUnitConfig();
    const f = uc.factor;

    let useXDates, useAvg, useMin, useMax, useCurrent, usePrev, usePrev2;
    let lastPtX, lastPtY;

    if (isMonthly) {
        useXDates = monthlyXDates;
        const amm = computeAvgMinMaxMonthly(rangeYears);
        useAvg = amm.avgData; useMin = amm.minData; useMax = amm.maxData;
        useCurrent = toMonthlyAvg(currentData);
        usePrev = toMonthlyAvg(prevData);
        usePrev2 = toMonthlyAvg(prev2Data);
        // Find last non-null month for current GY
        let lastIdx = -1;
        for (let m = 11; m >= 0; m--) { if (useCurrent[m] !== null) { lastIdx = m; break; } }
        lastPtX = lastIdx >= 0 ? monthlyXDates[lastIdx] : '2002-03-09';
        lastPtY = lastIdx >= 0 ? useCurrent[lastIdx] : 4754.80;
    } else {
        useXDates = xDates;
        const amm = computeAvgMinMax(rangeYears);
        useAvg = amm.avgData; useMin = amm.minData; useMax = amm.maxData;
        useCurrent = currentData;
        usePrev = prevData;
        usePrev2 = prev2Data;
        lastPtX = '2002-03-09';
        lastPtY = 4754.80;
    }

    const datasets = [
        {
            label: rangeLabel,
            data: convertArray(useMax, f).map((v, i) => ({x: useXDates[i], y: v})),
            borderColor: 'rgba(147, 149, 162, 0.0)',
            backgroundColor: 'rgba(147, 149, 162, 0.25)',
            fill: '+1',
            borderWidth: 0,
            pointRadius: 0,
            tension: 0.3,
            order: 6
        },
        {
            label: '_range_lower',
            data: convertArray(useMin, f).map((v, i) => ({x: useXDates[i], y: v})),
            borderColor: 'rgba(147, 149, 162, 0.0)',
            backgroundColor: 'transparent',
            fill: false,
            borderWidth: 0,
            pointRadius: 0,
            tension: 0.3,
            order: 6
        },
        {
            label: avgLabel,
            data: convertArray(useAvg, f).map((v, i) => ({x: useXDates[i], y: v})),
            borderColor: '#272962',
            backgroundColor: 'transparent',
            fill: false,
            borderWidth: 3,
            pointRadius: 0,
            tension: 0.3,
            order: 3
        },
        {
            label: 'GY23/24',
            data: convertArray(usePrev2, f).map((v, i) => ({x: useXDates[i], y: v})),
            borderColor: '#539648',
            backgroundColor: 'transparent',
            fill: false,
            borderWidth: 3,
            pointRadius: 0,
            tension: 0.3,
            order: 4
        },
        {
            label: 'GY24/25',
            data: convertArray(usePrev, f).map((v, i) => ({x: useXDates[i], y: v})),
            borderColor: '#0C5B19',
            backgroundColor: 'transparent',
            fill: false,
            borderWidth: 3,
            pointRadius: 0,
            tension: 0.3,
            order: 2
        },
        {
            label: 'GY25/26',
            data: convertArray(useCurrent, f).map((v, i) => ({x: useXDates[i], y: v})),
            borderColor: '#C00000',
            backgroundColor: 'transparent',
            fill: false,
            borderWidth: 3,
            pointRadius: 0,
            tension: 0.3,
            order: 1
        },
        {
            label: '_lastpoint',
            data: useXDates.map((x, i) => ({x: x, y: x === lastPtX ? lastPtY * f : null})),
            borderColor: '#C00000',
            backgroundColor: '#C00000',
            pointRadius: useXDates.map(x => x === lastPtX ? 6 : 0),
            pointHoverRadius: useXDates.map(x => x === lastPtX ? 7 : 0),
            showLine: false,
            order: 0
        }
    ];

    if (lngChart) {
        lngChart.destroy();
    }

    const ctx = document.getElementById('lngChart').getContext('2d');
    lngChart = new Chart(ctx, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 2.2,
            interaction: {
                mode: 'index',
                intersect: false
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        title: function(items) {
                            if (items.length > 0) {
                                const d = new Date(items[0].parsed.x);
                                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                                const longMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
                                if (isMonthly) {
                                    return longMonths[d.getUTCMonth()];
                                }
                                return d.getUTCDate() + ' ' + months[d.getUTCMonth()];
                            }
                            return '';
                        },
                        label: function(context) {
                            if (context.dataset.label.startsWith('_')) return null;
                            if (context.dataset.label.endsWith('range')) return null;
                            if (context.parsed.y === null) return null;
                            const lbl = context.dataset.label;
                            const valStr = fmt(context.parsed.y, uc.decimals) + ' ' + uc.label;
                            // For current GY last month in monthly mode, show actual date
                            if (isMonthly && lbl === 'GY25/26') {
                                const convArr = convertArray(useCurrent, f);
                                const isLastPt = context.dataIndex === convArr.length - 1 ||
                                    (context.dataIndex < convArr.length - 1 && convArr[context.dataIndex + 1] === null);
                                if (isLastPt) {
                                    return lbl + ' (01-' + lastDateStr + ' avg): ' + valStr;
                                }
                            }
                            return lbl + ': ' + valStr;
                        }
                    },
                    filter: function(item) {
                        const lbl = item.dataset.label;
                        if (!lbl || lbl.startsWith('_') || lbl.endsWith('range')) return false;
                        return true;
                    }
                },
                annotation: {}
            },
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'month',
                        displayFormats: {
                            month: 'MMM'
                        }
                    },
                    min: '2001-10-01',
                    max: '2002-09-30',
                    ticks: {
                        maxTicksLimit: 12,
                        font: {
                            family: FONT_FAMILY,
                            size: 14
                        },
                        color: TEXT_COLOR
                    },
                    grid: {
                        display: false
                    },
                    border: {
                        color: TEXT_COLOR
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: uc.label,
                        font: {
                            family: FONT_FAMILY,
                            size: 14
                        },
                        color: TEXT_COLOR
                    },
                    ticks: {
                        callback: function(value) {
                            return Math.round(value).toLocaleString('en-US');
                        },
                        font: {
                            family: FONT_FAMILY,
                            size: 14
                        },
                        color: TEXT_COLOR
                    },
                    grid: {
                        color: 'rgba(39, 41, 98, 1.0)'
                    },
                    border: {
                        color: TEXT_COLOR
                    }
                }
            }
        }
    });
}

// Build chart on page load
rebuildChart();
</script>
